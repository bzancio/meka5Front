<header class="header">
  <div class="header-inner">

    <a class="header-logo" routerLink="/">
      <img class="header-logo-icon" src="background.png" alt="Meka5 logo" />
      <span class="header-logo-text">Meka5</span>
    </a>

    <nav class="header-nav" aria-label="Navegación principal">
      <a class="header-nav-link" routerLink="/tests" routerLinkActive="header-nav-link-active">
        tests
      </a>
      <a class="header-nav-link" routerLink="/ranking" routerLinkActive="header-nav-link-active">
        ranking
      </a>
    </nav>

    <div class="header-actions">
      @if (auth.isLoggedIn()) {
        <a class="header-user" routerLink="/user">
          <span class="header-user-icon">●</span>
          {{ auth.username() ?? 'usuario' }}
        </a>
      } @else {
        <a class="header-login" routerLink="/login">
          <span class="header-login-icon">◎</span>
          login
        </a>
      }
    </div>

  </div>
</header>
