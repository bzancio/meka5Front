<app-header></app-header>

<div class="userinfo-container">

  <h2 class="title">Mi cuenta</h2>

  @if (successMessage()) {
    <div class="alert alert-success">{{ successMessage() }}</div>
  }

  <div class="info-section">
    <h3 class="section-title">Datos de acceso</h3>

    <div class="info-row">
      <span class="info-label">Usuario</span>
      <span class="info-value">{{ username() }}</span>
    </div>

    <div class="info-row">
      <span class="info-label">Contraseña</span>
      <span class="info-value">••••••••</span>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn primary" (click)="goToEditUsername()">Cambiar usuario</button>
    <button class="btn secondary" (click)="goToEditPassword()">Cambiar contraseña</button>
  </div>

  <p class="switch-text">
    <span class="link" (click)="goToHome()">← Volver al inicio</span>
  </p>

</div>

<app-footer></app-footer>
