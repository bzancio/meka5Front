<div class="register-container" (keydown.enter)="createAccount()">

  <img class="register-logo" src="background.png" alt="Meka5" />
  <h2 class="title">Crear cuenta</h2>

  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  }

  <input
    type="text"
    placeholder="Usuario"
    class="input"
    [value]="user()"
    (input)="user.set($any($event.target).value); userTouched.set(true)"
  />

  @if (!userValid() && userTouched()) {
    <p class="msg-error">El usuario no puede estar vacío</p>
  }

  <div class="pass-wrap">
    <input
      [type]="showPass() ? 'text' : 'password'"
      placeholder="Contraseña"
      class="input"
      [value]="pass()"
      (input)="pass.set($any($event.target).value)"
    />
    <button type="button" class="pass-toggle" (click)="showPass.update(v => !v)">
      {{ showPass() ? '●' : '◎' }}
    </button>
  </div>

  <div class="pass-wrap">
    <input
      [type]="showPass2() ? 'text' : 'password'"
      placeholder="Confirmar contraseña"
      class="input"
      [value]="pass2()"
      (input)="pass2.set($any($event.target).value)"
    />
    <button type="button" class="pass-toggle" (click)="showPass2.update(v => !v)">
      {{ showPass2() ? '●' : '◎' }}
    </button>
  </div>

  @if (!passwordsMatch() && pass2().length > 0) {
    <p class="msg-error">Las contraseñas no coinciden</p>
  }

  <button
    class="btn primary"
    [disabled]="!formValid()"
    (click)="createAccount()"
  >
    Crear cuenta
  </button>

  <p class="switch-text">
    ¿Ya tienes cuenta?
    <span class="link" (click)="goToLogin()">Inicia sesión</span>
  </p>

  <p class="switch-text">
    <span class="link" (click)="goToHome()">← Volver al inicio</span>
  </p>

</div>

<app-footer></app-footer>
