<header class="header"></header>

<div class="login-container">

  <h2 class="title">Iniciar sesión</h2>

  <input id="user" type="text" placeholder="Usuario" class="input" />
  <input id="pass" type="password" placeholder="Contraseña" class="input" />

  <button class="btn primary" (click)="login()">Iniciar sesión</button>

  <p class="switch-text">
    ¿No tienes cuenta?
    <span class="link" (click)="goToRegister()">Regístrate</span>
  </p>

</div>

<app-footer></app-footer>
